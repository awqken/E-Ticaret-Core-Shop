<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- HDD outer case -->
  <rect x="70" y="70" width="260" height="160" rx="10" fill="#475569"/>
  <!-- disk platter area -->
  <circle cx="185" cy="150" r="70" fill="#334155"/>
  <circle cx="185" cy="150" r="55" fill="#1e293b"/>
  <circle cx="185" cy="150" r="40" fill="#334155"/>
  <circle cx="185" cy="150" r="25" fill="#475569"/>
  <circle cx="185" cy="150" r="10" fill="#64748b"/>
  <!-- platter rings -->
  <circle cx="185" cy="150" r="68" fill="none" stroke="#64748b" stroke-width="1" opacity="0.4"/>
  <circle cx="185" cy="150" r="48" fill="none" stroke="#64748b" stroke-width="1" opacity="0.4"/>
  <!-- actuator arm -->
  <line x1="185" y1="150" x2="300" y2="90" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="300" cy="90" r="8" fill="#64748b"/>
  <!-- read/write head -->
  <rect x="296" y="82" width="18" height="6" rx="2" fill="#94a3b8"/>
  <!-- SATA connectors -->
  <rect x="295" y="165" width="35" height="12" rx="2" fill="#334155"/>
  <rect x="298" y="168" width="5" height="6" rx="1" fill="#94a3b8"/>
  <rect x="305" y="168" width="5" height="6" rx="1" fill="#94a3b8"/>
  <rect x="312" y="168" width="5" height="6" rx="1" fill="#94a3b8"/>
  <rect x="319" y="168" width="5" height="6" rx="1" fill="#94a3b8"/>
  <rect x="295" y="183" width="20" height="10" rx="2" fill="#334155"/>
  <!-- screw holes -->
  <circle cx="84" cy="84" r="5" fill="#334155"/>
  <circle cx="316" cy="84" r="5" fill="#334155"/>
  <circle cx="84" cy="216" r="5" fill="#334155"/>
  <circle cx="316" cy="216" r="5" fill="#334155"/>
  <!-- label -->
  <text x="200" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#475569">HDD</text>
</svg>
