<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ccfbf1"/>
      <stop offset="100%" stop-color="#99f6e4"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- M.2 PCB -->
  <rect x="155" y="55" width="90" height="190" rx="6" fill="#0f766e"/>
  <!-- controller chip -->
  <rect x="168" y="70" width="64" height="50" rx="4" fill="#0d9488"/>
  <rect x="175" y="77" width="50" height="36" rx="2" fill="#065f46"/>
  <line x1="175" y1="90" x2="225" y2="90" stroke="#14b8a6" stroke-width="1" opacity="0.5"/>
  <line x1="175" y1="102" x2="225" y2="102" stroke="#14b8a6" stroke-width="1" opacity="0.5"/>
  <line x1="191" y1="77" x2="191" y2="113" stroke="#14b8a6" stroke-width="1" opacity="0.5"/>
  <line x1="207" y1="77" x2="207" y2="113" stroke="#14b8a6" stroke-width="1" opacity="0.5"/>
  <!-- NAND chips -->
  <rect x="167" y="132" width="66" height="34" rx="3" fill="#0d9488"/>
  <rect x="167" y="172" width="66" height="34" rx="3" fill="#0d9488"/>
  <!-- chip text markings -->
  <rect x="174" y="139" width="52" height="4" rx="1" fill="#5eead4" opacity="0.6"/>
  <rect x="174" y="147" width="40" height="4" rx="1" fill="#5eead4" opacity="0.4"/>
  <rect x="174" y="179" width="52" height="4" rx="1" fill="#5eead4" opacity="0.6"/>
  <rect x="174" y="187" width="40" height="4" rx="1" fill="#5eead4" opacity="0.4"/>
  <!-- M.2 key connector -->
  <rect x="163" y="225" width="74" height="12" rx="2" fill="#134e4a"/>
  <rect x="165" y="228" width="5" height="6" rx="1" fill="#5eead4"/>
  <rect x="173" y="228" width="5" height="6" rx="1" fill="#5eead4"/>
  <rect x="181" y="228" width="5" height="6" rx="1" fill="#5eead4"/>
  <rect x="189" y="228" width="5" height="6" rx="1" fill="#5eead4"/>
  <rect x="197" y="228" width="5" height="6" rx="1" fill="#5eead4"/>
  <rect x="205" y="228" width="5" height="6" rx="1" fill="#5eead4"/>
  <rect x="213" y="228" width="5" height="6" rx="1" fill="#5eead4"/>
  <rect x="221" y="228" width="5" height="6" rx="1" fill="#5eead4"/>
  <!-- mounting hole -->
  <circle cx="200" cy="253" r="5" fill="#134e4a" stroke="#5eead4" stroke-width="1.5"/>
  <!-- label -->
  <text x="200" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#0f766e">NVMe SSD</text>
</svg>
