<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- PCB body -->
  <rect x="60" y="100" width="280" height="100" rx="8" fill="#16a34a"/>
  <!-- GPU chip -->
  <rect x="155" y="115" width="90" height="70" rx="6" fill="#15803d"/>
  <rect x="165" y="125" width="70" height="50" rx="3" fill="#14532d"/>
  <!-- chip grid -->
  <line x1="165" y1="142" x2="235" y2="142" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
  <line x1="165" y1="158" x2="235" y2="158" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
  <line x1="183" y1="125" x2="183" y2="175" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
  <line x1="200" y1="125" x2="200" y2="175" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
  <line x1="217" y1="125" x2="217" y2="175" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
  <!-- heatsink fins -->
  <rect x="80" y="108" width="18" height="84" rx="3" fill="#4ade80" opacity="0.7"/>
  <rect x="104" y="108" width="18" height="84" rx="3" fill="#4ade80" opacity="0.7"/>
  <rect x="128" y="108" width="18" height="84" rx="3" fill="#4ade80" opacity="0.7"/>
  <!-- VRAM chips -->
  <rect x="260" y="118" width="30" height="18" rx="3" fill="#15803d"/>
  <rect x="260" y="142" width="30" height="18" rx="3" fill="#15803d"/>
  <rect x="260" y="166" width="30" height="18" rx="3" fill="#15803d"/>
  <!-- PCIe connector -->
  <rect x="60" y="188" width="280" height="14" rx="2" fill="#166534"/>
  <rect x="70" y="192" width="8" height="6" rx="1" fill="#86efac"/>
  <rect x="84" y="192" width="8" height="6" rx="1" fill="#86efac"/>
  <rect x="98" y="192" width="8" height="6" rx="1" fill="#86efac"/>
  <rect x="112" y="192" width="8" height="6" rx="1" fill="#86efac"/>
  <rect x="126" y="192" width="8" height="6" rx="1" fill="#86efac"/>
  <rect x="140" y="192" width="8" height="6" rx="1" fill="#86efac"/>
  <!-- label -->
  <text x="200" y="264" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#15803d">Ekran Kartı</text>
</svg>
